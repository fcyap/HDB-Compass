# Source inventory for the HDB policy corpus (Member 3). One entry per official web page; every chunk the RAG
# retrieves cites the page it came from. Text is kept verbatim (data/policy_sources/extract_sources.py): no rewriting.
#
# capture: auto    fetched by data/policy_sources/fetch_sources.py (robots.txt checked, 1 request/second)
#          manual  the site refuses scripts (HDB, MAS: HTTP 403 / "service unavailable"); open the URL in a browser,
#                  check it is the right page, and save it as raw/<id>.html (Save Page As -> "Webpage, HTML Only")
#                  or raw/<id>.pdf (Print -> Save as PDF). Then run: fetch_sources.py --record-manual
# verified: false  the URL is the best-known address but has not been opened yet (HDB pages cannot be checked by
#                  script). Correct the URL if HDB moved the page, and set verified: true once saved.
# policy_category: classification | eligibility | grants | financing | eip | bto_priority | resale_process
# file:      the saved file's name in raw/ when it is not <id>.html / <id>.pdf (e.g. a browser's page-title name)
# exclude:   true keeps the capture but leaves the page out of the corpus (navigation hubs: links only, no policy)
# optional:  true lets the corpus be installed while this page is still missing
#
# Coverage checklist (the topics the first, hand-written corpus covered):
#   flat classification, eligibility schemes, wait-out, HFE letter, HDB loan / LTV, MSR / TDSR, BSD, CPF grants
#   (EHG, Family Grant, PHG, singles), CPF usage and the 95-year lease rule, EIP and SPR quota, EIP buyback,
#   BTO application / priority schemes, MOP and resale, renting out.

