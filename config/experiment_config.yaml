# HDB-Compass Experiment Configuration (config/experiment_config.yaml)
# Proposal Page 14 Specification: Models, temp=0.0, seed=42, chunking, top-k

global:
  seed: 42
  temperature: 0.0
  # No paid model: the chat model is set per profile under llm.profiles, the policy embeddings under policy_rag.

# Member 2: Geospatial & Commute Engine Settings
spatial:
  svy21_crs: "EPSG:3414"
  wgs84_crs: "EPSG:4326"
  default_search_radius_meters: 1000
  moe_school_priority_radius_meters: 1000
  moe_school_secondary_radius_meters: 2000
  circle_polygon_resolution: 64
  walking_speed_meters_per_min: 80.0 # ~4.8 km/h standard pedestrian speed
  data_sources:
    hdb_geojson_id: "d_16b157c52ed637edd6ba1232e026258d"
    hdb_property_id: "d_17f5382f26140b1fdae0ba2ef6239d2f"
    schools_dataset_id: "d_688b934f82c1059ed0a6993d2a829089"
    rail_stations_dataset_id: "d_8d886e3a83934d7447acdf5bc6959999"
    hawker_dataset_id: "d_68a42f09f350881996d83f9cd73ab02f"
    supermarket_dataset_id: "d_11edd0117280c5776651d7891114c88c"

# ---------------------------------------------------------------------------
# Member 4: LLM profiles, tool wiring and architecture study
# One model for ALL variants and the auditor (proposal §6.2). Select with
# LLM_PROFILE env var; LLM_BASE_URL / LLM_MODEL env vars override a profile.
# ---------------------------------------------------------------------------
llm:
  active: ollama        # ollama | vllm | none here; groq | openai | compatible (hosted_models.yaml) | auto
  auto_profiles: [ollama, groq, openai]
  profiles:
    ollama:                       # local dev on the laptop (M3 Pro, 18 GB)
      base_url: "http://localhost:11434/v1"
      model: "qwen3:14b"
      model_env: "OLLAMA_MODEL"
      reasoning_effort: "none"
      api_key_env: "OLLAMA_API_KEY"   # unused; any value works
      max_tokens: 2048
      timeout_s: 300
      system_suffix: " /no_think"     # Qwen3 soft switch: disable thinking for fast, deterministic tool calls
      # NOTE: Ollama defaults to a 4096-token context. Variant A needs ~8k+ for 11 tool schemas.
      # Start the Ollama server with OLLAMA_CONTEXT_LENGTH=16384 (see README, Member 4 section).
    vllm:                         # SMU Origami cluster, one 24 GB slice of an RTX PRO 6000, via cluster/tunnel.sh
      base_url: "http://localhost:8001/v1"
      model: "Qwen/Qwen3-30B-A3B-GPTQ-Int4"   # MoE, 3B active, 4-bit; fits a 24 GB slice with 40,960 context (see cluster/serve_vllm.sbatch)
      api_key_env: "VLLM_API_KEY"   # written into .env by cluster/tunnel.sh
      max_tokens: 4096
      timeout_s: 300
      system_suffix: " /no_think"   # same switch as the Ollama profile (same Qwen3 family)
      extra_body:
        chat_template_kwargs:
          enable_thinking: false    # Qwen3 template flag: no <think> block at all
    # Hosted profiles (groq, openai, compatible) live in config/hosted_models.yaml: the experiments name local
    # models only (proposal §6.2). The app may select them with LLM_PROFILE; agents/llm.py reads both files.

tools:
  # Per tool: "mock" (mcp_server/mock_tools.py) or "real". Members 1 and 3 flip
  # their tools to "real" when their modules land. Spatial tools are real already.
  use_mock:
    query_resale_blocks_by_criteria: real
    compute_town_price_timeseries: real
    query_comparable_resale_transactions: real
    compare_bto_launch_vs_resale: real   # data/bto/bto_launches.csv from HDB launch annexes
    filter_blocks_by_amenity_proximity: real
    verify_primary_school_distance: real
    find_primary_schools_near_address: real
    compute_dual_transit_commute: real
    sync_interactive_map_ui: real
    calculate_cpf_housing_grants: real
    calculate_maximum_affordability: real
    calculate_bsd_and_upfront_outlay: real
    retrieve_hdb_policy_knowledge: real
    # Research tools (Member 1; location tools shared with Member 2). No mocks exist.
    get_block_transaction_history: real
    get_market_snapshot: real
    rank_towns_by_value: real
    compare_resale_options: real
    assess_resale_price: real
    find_resale_blocks_near: real
    get_area_resale_statistics: real
    get_area_price_trend: real
    resolve_location: real
    get_nearby_amenities: real

# Add-on tool packs (agents/addons: research tools, school lookup). Their tools are listed above as real.
# offer_in: app = the app and Variant C (A and B keep the original tool lists, so their Tool F1 stays comparable);
#           all = every variant; off = none, exactly as before the packs. HDB_ADDONS overrides it for one run.
addons:
  offer_in: app

# Member 3: Advanced RAG & Regulatory Knowledge Base Settings
policy_rag:
  # SAGE-inspired ingestion uses sentence similarity (threshold 0.35, chosen on Category C by the Nov 2026 sweep) with a 380-word cap.
  # The SAGE paper's trained segmentation classifier is not included; see data/ingest_hdb_policy_rag.py.
  sparse_retriever: "BM25Okapi"
  dense_retriever: "all-MiniLM-L6-v2"
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rrf_k: 60
  candidate_top_k: 20
  final_passages_top_k: 5
  # Re-ranking of the hybrid candidates: ce_only = the cross-encoder alone; blend = 0.25 cross-encoder + 0.35 rank
  # fusion + 0.40 query-term coverage. On the official-page corpus the blend let every chunk of a page whose title
  # matches the question look relevant (short process steps outranked the rule); the ablation (Nov 2026) gave
  # Category E recall 0.87 for ce_only vs 0.57 for blend, Category C equal.
  rerank_mode: "ce_only"
  # The pipeline the app's policy search uses (read by policy_rag_tools.configured_pipeline). RAG-2 was the most
  # accurate on the 30 benchmark questions (recall 0.84 vs 0.81 for RAG-3) and about 5x faster (0.4 s vs 2.2 s, no
  # model calls); RAG-3 stays available by name.
  active_pipeline: "RAG-2"  # RAG-1 (dense) | RAG-2 (hybrid + rerank) | RAG-3 (RAG-2 + query rewrite + graph expansion)

architecture:
  auditor_max_retries: 2            # proposal §5 risk 2
  subagent_max_tool_iterations: 4   # ReAct loop cap per specialist
  relaxation_steps:                 # use case E2 sensitivity sweep
    max_budget_sgd_pct: 10
    amenity_radius_meters: 150
    min_remaining_lease_years: 5
  variants: ["A", "B", "C"]
  # While a tool is still mocked (tools.use_mock), say "cannot check this yet" instead of answering from its
  # sample data (policy rules, BTO launch prices). See supervisor.UNBUILT_NOTES.
  disclose_unbuilt_tools: true
  # Variant C / the app: code writes the answer's facts section; the model writes the opening and trade-offs.
  # HDB_CODE_WRITTEN_FACTS=0 or 1 overrides it for one run (the live ablation); the run settings record which.
  code_written_facts: true
  # Optional first pass that lists the stated facts in plain words before the structured constraint reading.
  # Off by default: it adds a model call; switch on only if the varied-phrasing test shows it helps.
  extraction_reasoning: false
