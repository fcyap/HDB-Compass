[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdb-compass"
version = "1.0.0"
description = "HDB-Compass: Multi-Agent & FastMCP Decision-Support System for Singapore Public Housing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.30",
    "fastmcp>=2.13,<2.14",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "duckdb>=1.4,<3",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "chromadb>=0.5.0",
    "ragas>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
