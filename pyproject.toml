[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdb-compass"
version = "1.0.0"
description = "HDB-Compass: Multi-Agent & FastMCP Decision-Support System for Singapore Public Housing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.30",
    "fastmcp>=0.4.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "duckdb>=0.10.0",
]
