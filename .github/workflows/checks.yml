name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reported-results:
    # No model, GPU, database or network access: recomputes the README's numbers from the tracked CSVs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python evaluation/reported_results/verify_results.py
